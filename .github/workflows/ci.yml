name: Mod CI
on: [push, pull_request]
jobs:
  save-create:
    runs-on: self-hosted
    if: github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
      - name: Run save-create
        run: bash tests/run.sh save-create

  suite:
    runs-on: self-hosted
    if: github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # Configurations are discovered within each suite
        suite: [lib, generator, solver, views, agriculture]
    steps:
      - uses: actions/checkout@v5
      - name: Run ${{ matrix.suite }}
        run: bash tests/run.sh suite ${{ matrix.suite }}
