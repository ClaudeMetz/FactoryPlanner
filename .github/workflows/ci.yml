name: Mod CI
on: [push, pull_request]
jobs:
  save-create:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: Run save-create
        run: bash tests/run.sh save-create

  world:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        # Every file in tests/worlds needs an entry here
        world: [vanilla, lib, generator, solver]
    steps:
      - uses: actions/checkout@v5
      - name: Run ${{ matrix.world }}
        run: bash tests/run.sh world ${{ matrix.world }}
